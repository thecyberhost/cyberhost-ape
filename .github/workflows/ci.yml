name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest "ruff==0.15.12"

      - name: Lint
        run: ruff check cyberhost

      - name: Validate manifest resolves to tools
        run: python -c "from cyberhost.registry import Manifest; m=Manifest.load(); print(len(m.tools), 'tools OK')"

      - name: Run tests (offline)
        run: python -m pytest -q
