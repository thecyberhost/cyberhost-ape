name: Release

# Builds the distributable ZIP on a version tag and attaches it to the release.
# The build resolves every tool at its current latest version from the official
# source, so release artifacts are always current.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build distributable ZIP
        run: python build.py --output dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberhost-ape-windows
          path: dist/*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
