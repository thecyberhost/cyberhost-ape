[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberhost-ape"
version = "0.1.0"
description = "CyberHost APE — a portable, self-updating Android pentesting framework console"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TCH" }]
keywords = ["android", "pentesting", "security", "frida", "apk", "mobile", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "PyYAML>=6.0",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
]

[project.urls]
Homepage = "https://github.com/thecyberhost/cyberhost-ape"
Issues = "https://github.com/thecyberhost/cyberhost-ape/issues"

[project.scripts]
cyberhost = "cyberhost.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools]
packages = ["cyberhost"]

[tool.setuptools.package-data]
cyberhost = ["data/*.yaml", "scripts/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so local and CI are identical regardless of ruff's
# evolving defaults: pyflakes + core pycodestyle + import sorting + pyupgrade.
# We intentionally do not enable opinionated security/blind-except/sorting
# lints (S/BLE/RUF0xx) that would flag deliberate graceful-degradation code.
select = ["E4", "E7", "E9", "F", "W", "I", "UP"]
ignore = ["E722"]  # bare except is used intentionally in a few guards

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
